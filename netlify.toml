[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/api/*"
  to = "https://portfolio-backend-43ii.onrender.com/api/:splat"
  status = 200

[[redirects]]
  from = "/sitemap.xml"
  to = "/sitemap.xml"
  status = 200
  force = false

[[redirects]]
  from = "/robots.txt"
  to = "/robots.txt"
  status = 200
  force = false

# Old case-study slugs → current ones
[[redirects]]
  from = "/project/openreception"
  to = "/project/doc-ai"
  status = 301

[[redirects]]
  from = "/project/agen"
  to = "/project/multi-agent-research"
  status = 301

[[redirects]]
  from = "/project/research-agent"
  to = "/project/dataos"
  status = 301

[[redirects]]
  from = "/project/resume-processing"
  to = "/project/hire-me-os"
  status = 301

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self' 'unsafe-inline' 'unsafe-eval' https://images.unsplash.com https://portfolio-backend-43ii.onrender.com https://www.googletagmanager.com; img-src 'self' data: blob: https://images.unsplash.com https://*.unsplash.com; font-src 'self' data:; media-src 'self' data: blob:; connect-src 'self' https://www.google-analytics.com https://*.google-analytics.com https://*.analytics.google.com https://portfolio-backend-43ii.onrender.com https://api.github.com https://github-contributions-api.jogruber.de https://formspree.io https://*.formspree.io; frame-src 'none'; object-src 'none';"
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
