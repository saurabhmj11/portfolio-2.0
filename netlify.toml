[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/api/*"
  to = "https://portfolio-backend-43ii.onrender.com/api/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self' 'unsafe-inline' 'unsafe-eval' https://fonts.googleapis.com https://fonts.gstatic.com https://images.unsplash.com https://portfolio-backend-43ii.onrender.com; img-src 'self' data: https://images.unsplash.com; font-src 'self' data: https://fonts.gstatic.com; media-src 'self' data:; connect-src 'self' https://portfolio-backend-43ii.onrender.com;"
    Cross-Origin-Opener-Policy = "same-origin"
    X-Frame-Options = "DENY"
